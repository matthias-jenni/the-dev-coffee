services:
  app:
    build: .
    command: tail -f /dev/null
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./:/workspace:cached
      - maven-repo:/root/.m2
    ports:
      - 8080:8080
    depends_on:
      - db

  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: devcoffee@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: devcoffee
      PGADMIN_CONFIG_WTF_CSRF_HEADERS: '["Referer", "Origin"]'
      PGADMIN_CONFIG_WTF_CSRF_ENABLED: 'False'
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    configs:
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
      - source: pgadmin-pgpass
        target: /pgpass
        uid: "5050"
        gid: "0"
        mode: 0600
    ports:
      - 5050:80
    depends_on:
      - db

  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: coffeeuser
      POSTGRES_PASSWORD: coffeepass
      POSTGRES_DB: devcoffee
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - 5433:5432

configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "devcoffee",
            "Group": "Servers",
            "Host": "db",
            "Port": 5432,
            "MaintenanceDB": "devcoffee",
            "Username": "coffeeuser",
            "PassFile": "/pgpass",
            "SSLMode": "prefer"
          }
        }
      }
  pgadmin-pgpass:
    content: db:5432:*:coffeeuser:coffeepass

volumes:
  pgadmin-data:
  pg-data:
  maven-repo: